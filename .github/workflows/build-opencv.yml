name: Build OpenCV
on:
  workflow_dispatch:
    inputs:
      opencv_version:
        description: 'OpenCV Version Tag (e.g., 4.10.0)'
        required: true
        default: '4.10.0'
  push:
    tags:
      - 'opencv-*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build OpenCV (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENCV_DIR: ${{ github.workspace }}/.opencv
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Determine OpenCV version
        run: |
          if [ -n "${{ inputs.opencv_version }}" ]; then
            version="${{ inputs.opencv_version }}"
          else
            version="${GITHUB_REF_NAME#opencv-}"
          fi
          echo "OPENCV_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libgl-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev libswscale-dev

      - name: Download OpenCV
        run: |
          src="$RUNNER_TEMP/opencv"
          mkdir -p "$src"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/opencv.tar.gz" "https://github.com/opencv/opencv/archive/refs/tags/${OPENCV_VERSION}.tar.gz"
          tar -xzf "$RUNNER_TEMP/opencv.tar.gz" -C "$src" --strip-components=1
          echo "OPENCV_SRC=$src" >> "$GITHUB_ENV"

      - name: Build OpenCV
        run: |
          cmake_args=(
            -DCMAKE_BUILD_TYPE=Release
            -DBUILD_LIST=core,imgproc,dnn,objdetect
            -DBUILD_SHARED_LIBS=ON
            -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF
            -DBUILD_DOCS=OFF -DBUILD_JAVA=OFF
            -DBUILD_opencv_apps=OFF -DBUILD_opencv_python3=OFF
            -DWITH_IPP=OFF -DWITH_OPENCL=OFF -DWITH_ADE=OFF -DWITH_FFMPEG=OFF
            -DWITH_GTK=OFF -DWITH_ITT=OFF -DWITH_EIGEN=OFF -DWITH_LAPACK=OFF
            -DOPENCV_GENERATE_PKGCONFIG=OFF
          )
          cmake -S "$OPENCV_SRC" -B "$RUNNER_TEMP/opencv-build" -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$OPENCV_DIR" "${cmake_args[@]}"
          cmake --build "$RUNNER_TEMP/opencv-build" --target install
          echo "OPENCV_CMAKE_ARGS=${cmake_args[*]}" >> "$GITHUB_ENV"

      - name: Compress OpenCV
        run: |
          tar -czvf "opencv-${OPENCV_VERSION}-linux.tar.gz" -C "$OPENCV_DIR" .

      - name: Write release manifest
        shell: pwsh
        run: |
          $ref = "refs/tags/$env:OPENCV_VERSION"
          $refs = @(git ls-remote https://github.com/opencv/opencv.git $ref "$ref^{}")
          $peeled = @($refs | Where-Object { $_ -like '*^{}' })
          $line = @($peeled + $refs)[0]
          if (-not $line) { throw "Upstream ref not found: $ref" }
          ./scripts/write-release-manifest.ps1 `
            -Asset "opencv-$env:OPENCV_VERSION-linux.tar.gz" `
            -Dependency opencv `
            -Version "$env:OPENCV_VERSION" `
            -Tag "opencv-$env:OPENCV_VERSION-r$env:GITHUB_RUN_NUMBER" `
            -UpstreamUrl https://github.com/opencv/opencv.git `
            -UpstreamRef $ref `
            -UpstreamCommit ($line -split '\s+')[0] `
            -SourceArchive "$env:RUNNER_TEMP/opencv.tar.gz" `
            -Parameters (@("platform=linux-x64", "generator=Ninja", "compiler=gcc") + ($env:OPENCV_CMAKE_ARGS -split ' '))

      - name: Upload OpenCV as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencv-${{ env.OPENCV_VERSION }}-linux
          path: |
            opencv-${{ env.OPENCV_VERSION }}-linux.tar.gz
            opencv-${{ env.OPENCV_VERSION }}-linux.tar.gz.manifest.json

      - name: Create GitHub release and upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="opencv-${OPENCV_VERSION}-r${GITHUB_RUN_NUMBER}"
          name="OpenCV ${OPENCV_VERSION} r${GITHUB_RUN_NUMBER}"
          archive="opencv-${OPENCV_VERSION}-linux.tar.gz"
          manifest="${archive}.manifest.json"

          for i in {1..5}; do
            if gh release view "$tag" >/dev/null 2>&1; then
              if gh release upload "$tag" "$archive" "$manifest"; then
                exit 0
              fi
            else
              if gh release create "$tag" "$archive" "$manifest" \
                --title "$name" \
                --notes "Linux x64 build for OpenCV ${OPENCV_VERSION}"; then
                exit 0
              fi
            fi
            if [ "$i" -eq 5 ]; then
              echo "Failed to create or upload release after 5 attempts"
              exit 1
            fi
            sleep $((5 * i))
          done

  build-windows:
    name: Build OpenCV (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Determine OpenCV version
        shell: pwsh
        run: |
          if ($env:INPUT_OPENCV_VERSION) {
            $version = $env:INPUT_OPENCV_VERSION
          } else {
            $version = $env:GITHUB_REF_NAME.TrimStart('opencv-')
          }
          "OPENCV_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        env:
          INPUT_OPENCV_VERSION: ${{ inputs.opencv_version }}

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Download OpenCV source
        shell: pwsh
        run: |
          $srcRoot = "$env:RUNNER_TEMP\opencv-src"
          New-Item -ItemType Directory -Force -Path $srcRoot | Out-Null
          $zipPath = "$env:RUNNER_TEMP\opencv.zip"
          curl -fsSL --retry 3 -o $zipPath "https://github.com/opencv/opencv/archive/refs/tags/$env:OPENCV_VERSION.zip"
          Expand-Archive -Path $zipPath -DestinationPath $srcRoot -Force
          $extractedDir = Join-Path $srcRoot "opencv-$env:OPENCV_VERSION"
          "OPENCV_SRC=$extractedDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and install OpenCV
        shell: pwsh
        run: |
          $installDir = "$env:RUNNER_TEMP\opencv-install"
          $buildDir = "$env:RUNNER_TEMP\opencv-build"
          $cmakeArgs = @(
            "-S", $env:OPENCV_SRC,
            "-B", $buildDir,
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_INSTALL_PREFIX=$installDir",
            "-DBUILD_LIST=core,imgproc,dnn,objdetect",
            "-DBUILD_SHARED_LIBS=ON",
            "-DBUILD_TESTS=OFF",
            "-DBUILD_PERF_TESTS=OFF",
            "-DBUILD_EXAMPLES=OFF",
            "-DBUILD_DOCS=OFF",
            "-DBUILD_JAVA=OFF",
            "-DBUILD_opencv_apps=OFF",
            "-DBUILD_opencv_python3=OFF",
            "-DWITH_IPP=OFF",
            "-DWITH_OPENCL=OFF",
            "-DWITH_ADE=OFF",
            "-DWITH_FFMPEG=OFF",
            "-DWITH_GTK=OFF",
            "-DWITH_ITT=OFF",
            "-DWITH_EIGEN=OFF",
            "-DWITH_LAPACK=OFF",
            "-DOPENCV_GENERATE_PKGCONFIG=OFF"
          )
          cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$buildDir" --target install --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OPENCV_INSTALL_DIR=$installDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $recordedArgs = $cmakeArgs | Where-Object { $_ -like '-D*' -and $_ -notlike '-DCMAKE_INSTALL_PREFIX=*' }
          "OPENCV_CMAKE_ARGS=$($recordedArgs -join ' ')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compress OpenCV
        shell: pwsh
        run: |
          $archive = "opencv-$env:OPENCV_VERSION-windows-x64.zip"
          Compress-Archive -Path "$env:OPENCV_INSTALL_DIR\*" -DestinationPath $archive -CompressionLevel Optimal

      - name: Write release manifest
        shell: pwsh
        run: |
          $ref = "refs/tags/$env:OPENCV_VERSION"
          $refs = @(git ls-remote https://github.com/opencv/opencv.git $ref "$ref^{}")
          $peeled = @($refs | Where-Object { $_ -like '*^{}' })
          $line = @($peeled + $refs)[0]
          if (-not $line) { throw "Upstream ref not found: $ref" }
          ./scripts/write-release-manifest.ps1 `
            -Asset "opencv-$env:OPENCV_VERSION-windows-x64.zip" `
            -Dependency opencv `
            -Version "$env:OPENCV_VERSION" `
            -Tag "opencv-$env:OPENCV_VERSION-r$env:GITHUB_RUN_NUMBER" `
            -UpstreamUrl https://github.com/opencv/opencv.git `
            -UpstreamRef $ref `
            -UpstreamCommit ($line -split '\s+')[0] `
            -SourceArchive "$env:RUNNER_TEMP\opencv.zip" `
            -Parameters (@("platform=windows-x64", "generator=Ninja", "compiler=msvc-x64") + ($env:OPENCV_CMAKE_ARGS -split ' '))

      - name: Upload OpenCV as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencv-${{ env.OPENCV_VERSION }}-windows-x64
          path: |
            opencv-${{ env.OPENCV_VERSION }}-windows-x64.zip
            opencv-${{ env.OPENCV_VERSION }}-windows-x64.zip.manifest.json

      - name: Create GitHub release and upload asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "opencv-$env:OPENCV_VERSION-r$env:GITHUB_RUN_NUMBER"
          $name = "OpenCV $env:OPENCV_VERSION r$env:GITHUB_RUN_NUMBER"
          $archive = "opencv-$env:OPENCV_VERSION-windows-x64.zip"
          $assets = @($archive, "$archive.manifest.json")

          for ($i = 1; $i -le 5; $i++) {
            gh release view $tag 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag @assets
            } else {
              gh release create $tag @assets `
                --title $name `
                --notes "Prebuilt OpenCV $env:OPENCV_VERSION binaries"
            }
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -eq 5) {
              Write-Error "Failed to create or upload release after 5 attempts"
              exit 1
            }
            Start-Sleep -Seconds (5 * $i)
          }
