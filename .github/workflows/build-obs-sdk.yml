name: Build OBS Studio SDK
on:
  workflow_dispatch:
    inputs:
      obs_version:
        description: 'OBS Version Tag (e.g., 32.2.1)'
        required: true
        default: '32.2.1'
  push:
    tags:
      - 'obs-*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build OBS Studio SDK (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      OBS_QT_VERSION: "6.11.0"
      OBS_BUILD_DIR: C:\obs-studio\build
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Determine OBS version
        shell: pwsh
        run: |
          if ($env:INPUT_OBS_VERSION) {
            $version = $env:INPUT_OBS_VERSION
          } else {
            $version = $env:GITHUB_REF_NAME -replace '^obs-', ''
          }
          if (-not $version) { throw 'OBS version could not be determined.' }
          "OBS_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        env:
          INPUT_OBS_VERSION: ${{ inputs.obs_version }}

      - name: Setup Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.OBS_QT_VERSION }}
          arch: win64_msvc2022_64
          modules: "qtnetworkauth qtwebsockets"
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
          cache: true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Select complete Windows SDK
        id: windows-sdk
        shell: pwsh
        run: |
          $libRoot = 'C:\Program Files (x86)\Windows Kits\10\Lib'
          $includeRoot = 'C:\Program Files (x86)\Windows Kits\10\Include'
          $minimum = [version]'10.0.20348.0'
          $sdk = Get-ChildItem $libRoot -Directory | Where-Object {
            $parsed = $null
            [version]::TryParse($_.Name, [ref]$parsed) -and
              $parsed -ge $minimum -and
              (Test-Path (Join-Path $_.FullName 'um')) -and
              (Test-Path (Join-Path (Join-Path $includeRoot $_.Name) 'um'))
          } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'No complete Windows SDK 10.0.20348.0 or newer was found.' }
          "OBS_WINDOWS_SDK_VERSION=$($sdk.Name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Clone OBS Studio
        shell: pwsh
        run: git clone --recursive --shallow-submodules --depth 1 --branch "$env:OBS_VERSION" https://github.com/obsproject/obs-studio.git C:\obs-studio

      - name: Build OBS Studio SDK
        shell: pwsh
        run: |
          cmake -S C:\obs-studio -B "$env:OBS_BUILD_DIR" `
            -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_SYSTEM_VERSION:STRING="$env:OBS_WINDOWS_SDK_VERSION" `
            -DCMAKE_VS_WINDOWS_TARGET_PLATFORM_VERSION:STRING="$env:OBS_WINDOWS_SDK_VERSION" `
            -DOBS_PARENT_ARCHITECTURE:STRING=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$env:OBS_BUILD_DIR" --config Release --parallel 4 --target libobs obs-frontend-api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package SDK
        shell: pwsh
        run: |
          $tag = "obs-$env:OBS_VERSION-r$env:GITHUB_RUN_NUMBER"
          ./scripts/package-obs-sdk.ps1 -SourceDir C:\obs-studio -BuildDir "$env:OBS_BUILD_DIR" -Destination C:\obs-sdk
          Compress-Archive -Path C:\obs-sdk\* -DestinationPath C:\obs-sdk-win64.zip -CompressionLevel Optimal
          ./scripts/write-release-manifest.ps1 `
            -Asset C:\obs-sdk-win64.zip `
            -Dependency obs-studio-sdk `
            -Version "$env:OBS_VERSION" `
            -Tag $tag `
            -UpstreamUrl https://github.com/obsproject/obs-studio.git `
            -UpstreamRef "$env:OBS_VERSION" `
            -UpstreamCommit (git -C C:\obs-studio rev-parse HEAD) `
            -Parameters @(
              "generator=Visual Studio 18 2026",
              "arch=x64",
              "config=Release",
              "targets=libobs,obs-frontend-api",
              "qt=$env:OBS_QT_VERSION",
              "windowsSdk=$env:OBS_WINDOWS_SDK_VERSION"
            )
          "RELEASE_TAG=$tag" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload SDK as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: obs-sdk-win64
          path: |
            C:\obs-sdk-win64.zip
            C:\obs-sdk-win64.zip.manifest.json

      - name: Create GitHub release and upload asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $name = "OBS Studio $env:OBS_VERSION SDK r$env:GITHUB_RUN_NUMBER (Windows x64)"
          $assets = @("C:\obs-sdk-win64.zip", "C:\obs-sdk-win64.zip.manifest.json")

          for ($i = 1; $i -le 5; $i++) {
            gh release view $tag 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag @assets
            } else {
              gh release create $tag @assets `
                --title $name `
                --notes "Minimal Windows x64 SDK (libobs and obs-frontend-api headers and import libraries) for OBS Studio $env:OBS_VERSION"
            }
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -eq 5) {
              Write-Error "Failed to create or upload release after 5 attempts"
              exit 1
            }
            Start-Sleep -Seconds (5 * $i)
          }
