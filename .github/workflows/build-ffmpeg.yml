name: Build FFmpeg
on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'FFmpeg Version Tag (e.g., 7.1)'
        required: true
        default: '7.1'
  push:
    tags:
      - 'ffmpeg-*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Package FFmpeg (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Determine FFmpeg version
        shell: pwsh
        run: |
          if ($env:INPUT_FFMPEG_VERSION) {
            $version = $env:INPUT_FFMPEG_VERSION
          } else {
            $version = $env:GITHUB_REF_NAME.TrimStart('ffmpeg-')
          }
          "FFMPEG_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        env:
          INPUT_FFMPEG_VERSION: ${{ inputs.ffmpeg_version }}

      - name: Download and package FFmpeg development libraries
        shell: pwsh
        run: |
          $tempDir = $env:RUNNER_TEMP
          $downloadUrl = "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/ffmpeg-$env:FFMPEG_VERSION-full_build-shared.7z"
          $archive7z = "$tempDir\ffmpeg-$env:FFMPEG_VERSION.7z"
          $extractDir = "$tempDir\ffmpeg-extracted"
          $cleanDir = "$tempDir\ffmpeg-clean"

          New-Item -ItemType Directory -Force -Path $cleanDir | Out-Null
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

          Write-Host "Downloading FFmpeg from $downloadUrl..."
          try {
            curl -fsSL --retry 3 -o $archive7z $downloadUrl
          } catch {
            $fallbackUrl = "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-$env:FFMPEG_VERSION-full_build-shared.7z"
            Write-Host "Primary download failed, attempting fallback from $fallbackUrl..."
            curl -fsSL --retry 3 -o $archive7z $fallbackUrl
          }

          7z x $archive7z -o"$extractDir" -y | Out-Null

          $topDir = Get-ChildItem -Path $extractDir -Directory | Select-Object -First 1
          if (-not $topDir) { throw "Extraction did not produce any directory." }

          Copy-Item -Path "$($topDir.FullName)\*" -Destination $cleanDir -Recurse -Force

          # Verify mandatory headers and import libraries for obs-noter
          $requiredFiles = @(
            "$cleanDir\include\libavformat\avformat.h",
            "$cleanDir\include\libavcodec\avcodec.h",
            "$cleanDir\include\libavutil\avutil.h",
            "$cleanDir\include\libswresample\swresample.h",
            "$cleanDir\include\libswscale\swscale.h",
            "$cleanDir\lib\avformat.lib",
            "$cleanDir\lib\avcodec.lib",
            "$cleanDir\lib\avutil.lib",
            "$cleanDir\lib\swresample.lib",
            "$cleanDir\lib\swscale.lib"
          )

          foreach ($f in $requiredFiles) {
            if (-not (Test-Path $f)) {
              throw "Missing required FFmpeg file: $f"
            }
          }

          "FFMPEG_CLEAN_DIR=$cleanDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compress FFmpeg
        shell: pwsh
        run: |
          $archive = "ffmpeg-$env:FFMPEG_VERSION-windows-x64.zip"
          Compress-Archive -Path "$env:FFMPEG_CLEAN_DIR\*" -DestinationPath $archive -CompressionLevel Optimal

      - name: Upload FFmpeg as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-${{ env.FFMPEG_VERSION }}-windows-x64
          path: ffmpeg-${{ env.FFMPEG_VERSION }}-windows-x64.zip

      - name: Create GitHub release and upload asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "ffmpeg-$env:FFMPEG_VERSION-r$env:GITHUB_RUN_NUMBER"
          $name = "FFmpeg $env:FFMPEG_VERSION r$env:GITHUB_RUN_NUMBER"
          $archive = "ffmpeg-$env:FFMPEG_VERSION-windows-x64.zip"

          for ($i = 1; $i -le 5; $i++) {
            gh release view $tag 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $archive
            } else {
              gh release create $tag $archive `
                --title $name `
                --notes "Prebuilt FFmpeg $env:FFMPEG_VERSION development libraries and runtime for Windows x64"
            }
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -eq 5) {
              Write-Error "Failed to create or upload release after 5 attempts"
              exit 1
            }
            Start-Sleep -Seconds (5 * $i)
          }
